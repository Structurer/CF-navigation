# Cloudflare Worker配置文件

# Worker名称
name = "nav-api-worker"

# 主入口文件
main = "src/index.js"

# 兼容日期
compatibility_date = "2023-12-31"

# 路由配置
[[routes]]
pattern = "worker.ceshi.autos/*"
zone_name = "ceshi.autos"

# KV命名空间绑定
[[kv_namespaces]]
binding = "NAV_DATA"  # 绑定到Worker中的env.NAV_DATA
id = "d89f01269b9b420a81f14b7a12558433"  # 替换为你的KV命名空间ID
preview_id = "d89f01269b9b420a81f14b7a12558433"  # 预览环境也使用相同的KV

# 环境变量（API密钥，用于验证权限）
[vars]
API_KEY = "Y0urC0mpl3xAP1K3y168"  # 替换为你的API密钥