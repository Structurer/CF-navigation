<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航</title>
    <style>
        /* 整体页面样式 无修改 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .top-section {
            background: linear-gradient(135deg, #b9e0ff 0%, #9fcfff 100%);
            height: 25vh;
            min-height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            background: white;
            padding: 8px;
            border-radius: 0px 50px 50px 0px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 600px;
            transition: transform 0.6s, box-shadow 0.6s;
        }
        .search-bar:hover {
            transform: scale(1.01);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }
        .google-button {
            background-color: #f8f9fa;
            color: #333;
            border: 1px solid #dadce0;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .google-button:hover {
            background-color: #f1f3f4;
            border-color: #d1d5db;
        }
        input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            flex: 1;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #7fc4ff;
            box-shadow: 0 0 0 2px rgba(127, 196, 255, 0.2);
        }
        .baidu-button {
            background: #7fc4ff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        .baidu-button:hover {
            background: #6bbfff;
        }
        .bottom-section {
            background-color: #ebf7ff;
            padding-top: 30px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        /* 外层容器：上下两栏承载，无Grid，仅统一宽高居中 */
        #icon-container {  
            width: 100%;
            max-width: 1200px;
            height: auto;
            margin: 0 30px 30px;
        }
        /* 单栏样式：上下分隔+内部Grid自适应，核心样式不变 */
        .category-column {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 25px;
            justify-items: center;
            width: 100%;
            margin-bottom: 60px; /* 上下栏分隔空白 */
        }
        /* 最后一栏去掉底部间距，避免多余留白 */
        .category-column:last-child {
            margin-bottom: 0;
        }
        /* 图标样式：完全不变，复用原有效果 */
        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 80px;
            gap: 8px;
        }
        .icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .icon:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
        }
        .icon img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            border-radius: 18px;
        }
        .icon-name {
            font-size: 14px;
            color: #333;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-section">
            <div class="search-bar">
                <button id="googleButton" class="google-button">Go</button>
                <input type="text" id="searchInput" placeholder="请输入搜索内容" autocomplete="off">
                <button id="baidusearchButton" class="baidu-button">搜索</button>
            </div>
        </div>
        <div class="bottom-section">
            <div id="icon-container"></div>
        </div>
    </div>

    <script>
        // 1. 搜索功能：完全复用，无任何修改
        const baiduButton = document.getElementById('baidusearchButton');
        const googleButton = document.getElementById('googleButton');
        const searchInput = document.getElementById('searchInput');
        function performSearch(searchUrlPrefix, searchText) {
            if (searchText.trim() !== '') {
                const searchUrl = `${searchUrlPrefix}${encodeURIComponent(searchText)}`;
                window.location.href = searchUrl;
            }
        }
        baiduButton.addEventListener('click', () => {
            performSearch('https://www.baidu.com/s?wd=', searchInput.value);
        });
        googleButton.addEventListener('click', () => {
            performSearch('https://www.google.com/search?q=', searchInput.value);
        });
        searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                performSearch('https://www.baidu.com/s?wd=', searchInput.value);
            }
        });

        // 2. 核心配置：创建上下2个栏目容器（固定上栏=column1，下栏=column2）
        const container = document.getElementById('icon-container');
        const column1 = document.createElement('div'); // 上栏容器（对应icons1.json）
        const column2 = document.createElement('div'); // 下栏容器（对应icons2.json）
        column1.className = 'category-column';
        column2.className = 'category-column';
        container.appendChild(column1);
        container.appendChild(column2);

        // 3. 封装图标渲染公共函数：复用渲染逻辑，避免重复代码，传【栏目容器+图标数据】即可渲染
        function renderIcons(column, iconsData) {
            iconsData.forEach(item => {
                const iconItem = document.createElement('div');
                iconItem.className = 'icon-item';
                const iconDiv = document.createElement('div');
                iconDiv.className = 'icon';
                iconDiv.style.backgroundColor = item.backgroundColor;
                const img = document.createElement('img');
                img.src = item.icon;
                img.alt = item.name;
                const iconName = document.createElement('div');
                iconName.className = 'icon-name';
                iconName.textContent = item.name;
                // 图标点击跳转
                iconItem.onclick = () => window.open(item.url, '_self');
                // 拼接DOM结构
                iconDiv.appendChild(img);
                iconItem.appendChild(iconDiv);
                iconItem.appendChild(iconName);
                // 放入对应栏目
                column.appendChild(iconItem);
            });
        }

        // 4. 分别读取2个JSON文件，对应渲染到上下两栏（自动匹配，无需分类）
        // 上栏：读取icons1.json，渲染到column1
        fetch('webs1.json')
            .then(res => res.json())
            .then(data => renderIcons(column1, data))
            .catch(err => console.error('上栏图标加载失败：', err));
        // 下栏：读取icons2.json，渲染到column2
        fetch('webs2.json')
            .then(res => res.json())
            .then(data => renderIcons(column2, data))
            .catch(err => console.error('下栏图标加载失败：', err));
    </script>
</body>
</html>
